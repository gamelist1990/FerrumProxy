# Copy to a separate config, replace the backend host, then run:
# ferrum-proxy --config config.nethernet.example.yml
# Optionally set nethernetAdvertiseHost to add the public proxy candidate.
endpoint: 6000
useRestApi: false
savePlayerIp: false
debug: false
firewall:
  enabled: false
ddosGuard:
  enabled: true
listeners:
  - bind: 0.0.0.0
    tcp: 5000
    udp: 5000
    bedrockTransport: nethernet
    # nethernetAdvertiseHost: 203.0.113.10 # Replace with your public proxy IP.
    # nethernetAdvertisePort: 5000 # Defaults to this listener's UDP port.
    # Sends TCP PROXY v2 to builtin signaling; never adds it to WebRTC UDP.
    haproxy: true
    target:
      host: 192.0.2.10 # Replace with the reachable PEXServer address.
      tcp: 5000
      udp: 5000
